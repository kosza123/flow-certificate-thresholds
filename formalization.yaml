version: "v0.4"
project:
  name: "Spanning trees per edge: a sharp bound and a question of Kenyon"
  description: >-
    For every finite multigraph with m at least one edge, the number of
    spanning trees tau satisfies tau^2 * 8^m < 27^m. The base sqrt(27/8)
    is optimal and is never attained. The formalization uses labelled edges
    with loops and parallel edges permitted and provides a direct sharpness
    proof using an explicit family of graphs.
  authors:
    - "Filip Majchrzak"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Filip Majchrzak"
classification:
  arxiv: ["math.CO", "math.LO"]
  msc2020: ["05C35", "05C05", "03B35"]
