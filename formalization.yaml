    Both the universal strict bound and sharpness are formalized in the
    baseline. The planar optimum, exact fixed-edge extremizers, and the
    general large-girth limit quoted as Proposition 2 are outside scope.
    This port is a candidate until Comparator checks succeed. Initial CI compiled Challenge and Solution; Comparator rejected a configuration error, now corrected, with fresh verification pending.
